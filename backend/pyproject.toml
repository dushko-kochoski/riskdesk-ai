[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riskdesk-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the RiskDesk AI portfolio demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.3",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools.packages.find]
include = ["riskdesk_ai*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires an isolated PostgreSQL test database",
]
