name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend and frontend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: riskdesk_test
          POSTGRES_USER: riskdesk
          POSTGRES_PASSWORD: riskdesk_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskdesk -d riskdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      RISKDESK_DATABASE_URL: sqlite://
      RISKDESK_TEST_DATABASE_URL: postgresql+psycopg://riskdesk:riskdesk_test_only@localhost:5432/riskdesk_test
      RISKDESK_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://riskdesk:riskdesk_test_only@localhost:5432/riskdesk_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements.lock
      - name: Run isolated SQLite unit tests
        run: python -m pytest -m "not integration"
      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration
      - name: Run Ruff
        run: python -m ruff check .
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Run ESLint
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
